name: Swift Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Build and test
    runs-on: macos-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Report Swift version
        run: swift --version

      - name: Run package tests
        run: swift test --parallel

      - name: Build lunalith-context
        run: swift build -c release --product lunalith-context

      - name: Smoke test lunalith-context
        run: |
          first=$(echo '{"message":"I have not slept in three days","timestamp":1000}' | .build/release/lunalith-context)
          echo "$first" | python3 -c "import sys,json; d=json.load(sys.stdin); assert 'SIMULATED STATE' in d['systemContext']; print('turn 1 ok')"
          echo "$first" | python3 -c "import sys,json; d=json.load(sys.stdin); print(json.dumps({'message':'Still have not slept','snapshot':d['snapshot'],'timestamp':1060}))" \
            | .build/release/lunalith-context \
            | python3 -c "import sys,json; d=json.load(sys.stdin); assert 'User said: I have not slept in three days' in d['systemContext']; print('turn 2 ok')"
